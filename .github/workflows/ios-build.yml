name: Build VIU for sideloading

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viu-ios-build
  cancel-in-progress: true

jobs:
  build:
    # Standard runners are free for public repositories. Do not consume a
    # private account's allowance or incur overage under the zero-cost brief.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check website adapters
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          cd ..
          swift ios/generate-icon.swift
          cd ios
          xcodegen generate
      - name: Compile for physical iPhone
        run: |
          xcodebuild -project ios/VIU.xcodeproj -scheme VIU \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/VIU.app package/Payload/
          cd package
          zip -qr ../VIU-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VIU-unsigned-ipa
          path: VIU-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Select iPhone simulator
        run: |
          xcrun simctl list devices available --json > devices.json
          python3 - <<'PY'
          import json, os
          devices = [d for runtime, rows in json.load(open('devices.json'))['devices'].items()
                     if 'iOS' in runtime for d in rows if 'iPhone' in d['name']]
          devices.sort(key=lambda d: ('16 Pro Max' in d['name'], 'Pro Max' in d['name']), reverse=True)
          assert devices, 'No available iPhone simulator'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('VIU_SIMULATOR=' + devices[0]['udid'] + '\n')
          print('Selected simulator:', devices[0]['name'])
          PY
      - name: Run native UI checks
        timeout-minutes: 8
        run: |
          xcrun simctl boot "$VIU_SIMULATOR" || true
          xcrun simctl bootstatus "$VIU_SIMULATOR" -b
          xcodebuild test -project ios/VIU.xcodeproj -scheme VIU \
            -destination "platform=iOS Simulator,id=$VIU_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath UIResults.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 90 \
            CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        run: |
          mkdir -p simulator-diagnostics
          xcrun simctl io "$VIU_SIMULATOR" screenshot simulator-diagnostics/simulator.png || true
          xcrun simctl spawn "$VIU_SIMULATOR" log show --last 15m --style compact \
            --predicate 'process == "VIU" OR eventMessage CONTAINS "personal.viu.client"' \
            > simulator-diagnostics/viu-process.log 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$VIU_SIMULATOR/data/Library/Logs" \
            -type f -name '*VIU*' -exec cp {} simulator-diagnostics/ \; 2>/dev/null || true
          if [ -d UIResults.xcresult ]; then
            xcrun xcresulttool export attachments --path UIResults.xcresult --output-path simulator-screenshots || true
            xcrun xcresulttool export diagnostics --path UIResults.xcresult --output-path simulator-diagnostics/xcresult || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VIU-simulator-checks
          path: |
            simulator-screenshots/
            simulator-diagnostics/
          retention-days: 1
